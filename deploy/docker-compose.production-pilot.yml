x-jiejing-logging: &jiejing-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  jiejing-saas:
    build:
      context: ..
      dockerfile: Dockerfile.saas
      sbom: true
      provenance: mode=max
    env_file:
      - ../../private/jiejing-saas.production.env
    depends_on:
      jiejing-vault:
        condition: service_healthy
      jiejing-vault-token-renewer:
        condition: service_healthy
    environment:
      JIEJING_PUBLIC_BASE_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_PUBLIC_APP_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_STABLE_DOMAIN: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_TARGET_APP_HOST: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_CORS_ORIGIN: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_EBAY_ACCOUNT_DELETION_ENDPOINT_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/webhooks/ebay/marketplace-account-deletion"
      JIEJING_WECHAT_PAY_NOTIFY_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/billing/domestic/wechat-pay/notify"
      JIEJING_WECHAT_PAY_REFUND_NOTIFY_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/billing/domestic/wechat-pay/refund-notify"
      JIEJING_TURNSTILE_ALLOWED_HOSTNAMES: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_VAULT_TOKEN_FILE: "/run/secrets/jiejing-vault-token"
    volumes:
      - jiejing_production_data:/data
      - jiejing_production_media:/var/lib/jiejing/media-assets
      - ../../private/jiejing-vault-token.d/jiejing-vault-token:/run/secrets/jiejing-vault-token:ro
    networks:
      - jiejing_app
      - jiejing_secrets
    expose:
      - "8788"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health/startup', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *jiejing-logging

  jiejing-worker:
    build:
      context: ..
      dockerfile: Dockerfile.saas
      sbom: true
      provenance: mode=max
    depends_on:
      jiejing-saas:
        condition: service_healthy
    env_file:
      - ../../private/jiejing-saas.production.env
    environment:
      JIEJING_PUBLIC_BASE_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_PUBLIC_APP_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_STABLE_DOMAIN: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_TARGET_APP_HOST: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_CORS_ORIGIN: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_EBAY_ACCOUNT_DELETION_ENDPOINT_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/webhooks/ebay/marketplace-account-deletion"
      JIEJING_WECHAT_PAY_NOTIFY_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/billing/domestic/wechat-pay/notify"
      JIEJING_WECHAT_PAY_REFUND_NOTIFY_URL: "https://${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}/billing/domestic/wechat-pay/refund-notify"
      JIEJING_TURNSTILE_ALLOWED_HOSTNAMES: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_VAULT_TOKEN_FILE: "/run/secrets/jiejing-vault-token"
    volumes:
      - jiejing_production_data:/data
      - jiejing_production_media:/var/lib/jiejing/media-assets
      - ../../private/jiejing-vault-token.d/jiejing-vault-token:/run/secrets/jiejing-vault-token:ro
    networks:
      - jiejing_app
      - jiejing_secrets
    command:
      - python
      - tools/jiejing_worker_cli.py
      - --db
      - /data/saas.sqlite
      - --runtime-db
      - /data/runtime.sqlite
      - --output-root
      - /data/output
      - run-loop
      - --idle-sleep
      - "10"
    logging: *jiejing-logging
    restart: unless-stopped

  jiejing-vault:
    image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    command: ["vault", "server", "-config=/vault/config/vault.production.hcl"]
    cap_add:
      - IPC_LOCK
    expose:
      - "8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.production.hcl:/vault/config/vault.production.hcl:ro
      - jiejing_production_vault_data:/vault/file
    networks:
      - jiejing_secrets
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          vault status -format=json 2>/dev/null |
          grep -q '"initialized":true' &&
          vault status -format=json 2>/dev/null |
          grep -q '"sealed":false'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *jiejing-logging
    restart: unless-stopped

  jiejing-vault-paper-controller:
    profiles: ["operator-only"]
    build:
      context: ..
      dockerfile: Dockerfile.saas
      sbom: true
      provenance: mode=max
    depends_on:
      jiejing-vault:
        condition: service_started
    environment:
      VAULT_ADDR: "http://jiejing-vault:8200"
    command:
      - python
      - tools/jiejing_vault_sealed_paper_ceremony.py
    volumes:
      - ./vault-policy.production.hcl:/run/jiejing-vault-policy/vault-policy.production.hcl:ro
      - ../../private/jiejing-vault-token.d:/run/jiejing-vault-token-output
    networks:
      - jiejing_secrets
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: "no"
    logging:
      driver: "none"

  jiejing-vault-token-renewer:
    image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    depends_on:
      jiejing-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://jiejing-vault:8200"
    command:
      - sh
      - -ec
      - >-
        while true; do
          export VAULT_TOKEN="$$(cat /run/secrets/jiejing-vault-token)";
          test "$$(vault token lookup -field=renewable)" = "true";
          test "$$(vault token lookup -field=period)" -gt 0;
          vault token renew -increment=720h -format=json >/dev/null;
          sleep 21600;
        done
    networks:
      - jiejing_secrets
    volumes:
      - ../../private/jiejing-vault-token.d/jiejing-vault-token:/run/secrets/jiejing-vault-token:ro
    healthcheck:
      test: ["CMD-SHELL", "export VAULT_TOKEN=$$(cat /run/secrets/jiejing-vault-token); test $$(vault token lookup -field=renewable) = true && test $$(vault token lookup -field=period) -gt 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *jiejing-logging
    restart: unless-stopped

  jiejing-frontend:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    depends_on:
      - jiejing-saas
    expose:
      - "80"
    networks:
      - jiejing_app
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../app.html:/usr/share/nginx/html/app.html:ro
      - ../privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ../terms.html:/usr/share/nginx/html/terms.html:ro
      - ../refund-policy.html:/usr/share/nginx/html/refund-policy.html:ro
      - ../support.html:/usr/share/nginx/html/support.html:ro
      - ../risk-disclosure.html:/usr/share/nginx/html/risk-disclosure.html:ro
      - ./robots.production.txt:/usr/share/nginx/html/robots.txt:ro
      - ../app.js:/usr/share/nginx/html/app.js:ro
      - ../styles.css:/usr/share/nginx/html/styles.css:ro
      - ../favicon.ico:/usr/share/nginx/html/favicon.ico:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-security-headers.production.conf:/etc/nginx/snippets/jiejing-security-headers.conf:ro
    logging: *jiejing-logging
    restart: unless-stopped

  jiejing-edge:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - jiejing-frontend
      - jiejing-saas
    ports:
      - "80:80"
      - "443:443"
    networks:
      - jiejing_app
    environment:
      JIEJING_PRODUCTION_HOST: "${JIEJING_PRODUCTION_HOST:?set an isolated production hostname}"
      JIEJING_ACME_EMAIL: "${JIEJING_ACME_EMAIL:?set the production ACME contact}"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - jiejing_caddy_data:/data
      - jiejing_caddy_config:/config
    logging: *jiejing-logging
    restart: unless-stopped

volumes:
  jiejing_production_data:
  jiejing_production_media:
  jiejing_caddy_data:
  jiejing_caddy_config:
  jiejing_production_vault_data:

networks:
  jiejing_app:
  jiejing_secrets:
    internal: true
