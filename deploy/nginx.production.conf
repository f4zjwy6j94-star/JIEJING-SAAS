server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    set $jiejing_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    include /etc/nginx/snippets/jiejing-security-headers.conf;

    location = /robots.txt {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /robots.txt =404;
    }

    location ~* \.map$ {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 404;
    }

    location ~ ^/(?:\.git|\.github|deploy|tools|docs|tests|jiejing_saas|jiejing_runtime|schemas|output|private)(?:/|$) {
        return 404;
    }

    location ~* \.(?:env|pem|key|sqlite|db|py|pyc|md|ya?ml|toml|ini|log|bak|zip|tar|gz|ps1|sh|conf)$ {
        return 404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|webm|wav|mp4|json|txt)$ {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /app.html {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        if ($arg_start != "app") {
            return 302 https://$host/index.html?source=direct_app_entry&start=site;
        }
        try_files /app.html =404;
    }

    location = /ops.html { return 404; }
    location = /ops.js { return 404; }
    location = /ops.css { return 404; }

    location / {
        include /etc/nginx/snippets/jiejing-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
