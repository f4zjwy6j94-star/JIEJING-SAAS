services:
  jiejing-saas:
    build:
      context: ..
      dockerfile: Dockerfile.saas
    env_file:
      - ../../private/tencent-managed.env
      - ../../private/jiejing-saas.staging-oauth.env
      - ../../private/postgres-localqueue.env
    environment:
      JIEJING_SAAS_ENV: "staging"
      JIEJING_CORS_ORIGIN: "https://app.jiejing.shop"
      JIEJING_ALLOW_HERMES_ADAPTERS: "false"
      JIEJING_ENABLE_DEMO_SESSION_BOOTSTRAP: "false"
      JIEJING_ALLOW_HERMES_MODEL_FALLBACK: "false"
      JIEJING_ENABLE_REAL_PLATFORM_WRITES: "false"
      JIEJING_EBAY_WRITE_LIVE: "false"
      JIEJING_EBAY_DRAFT_SAVE_LIVE: "false"
      JIEJING_EBAY_CONTROLLED_PUBLISH_LIVE: "false"
      JIEJING_PUBLIC_STAGING_REAL_WRITE_POLICY: "disabled_public_staging"
      JIEJING_BILLING_PROVIDER: "stripe_test_mock"
    ports:
      - "8788:8788"
    volumes:
      - jiejing_oauth_staging_data:/data
    restart: unless-stopped

volumes:
  jiejing_oauth_staging_data:
