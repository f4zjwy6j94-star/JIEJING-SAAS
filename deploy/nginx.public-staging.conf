server {
    listen 80;
    server_name ops.jiejing.shop;

    root /usr/share/nginx/html;
    index ops.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    set $jiejing_ops_csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy $jiejing_ops_csp always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = / {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy $jiejing_ops_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files /ops.html =404;
    }

    location = /ops.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy $jiejing_ops_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files /ops.html =404;
    }

    location = /ops.css {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $jiejing_ops_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /ops.js {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, immutable" always;
