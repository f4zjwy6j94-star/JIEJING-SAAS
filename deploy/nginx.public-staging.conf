server {
    listen 80 default_server;
    server_name app.jiejing.shop jiejing.shop 43.129.205.244 localhost 127.0.0.1 _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    set $jiejing_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";

    if ($host !~* ^(individually-buffalo-prescribed-blocking\.trycloudflare\.com|jiejing\.shop|app\.jiejing\.shop|43\.129\.205\.244|localhost|127\.0\.0\.1)$) {
        return 444;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy $jiejing_csp always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files /robots.txt =404;
    }

    location ~* \.map$ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        return 404;
    }

    location ~ ^/(?:\.git|\.github|deploy|tools|docs|tests|jiejing_saas|jiejing_runtime|schemas|output|private)(?:/|$) {
        return 404;
    }

    location ~* \.(?:env|pem|key|sqlite|db|py|pyc|md|ya?ml|toml|ini|log|bak|zip|tar|gz|ps1|sh|conf)$ {
        return 404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|webm|wav|mp4|json|txt|map)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy $jiejing_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy $jiejing_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files /index.html =404;
    }

    location = /app.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy $jiejing_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        if ($arg_start != "app") {
            return 302 https://$host/index.html?source=direct_app_entry&start=site;
        }
        try_files /app.html =404;
    }

    location = /ops.html { return 404; }
    location = /ops.js { return 404; }
    location = /ops.css { return 404; }
    location = /assets/jiejing-ops-panels.js { return 404; }
    location = /owner/operations/feedback { return 404; }
    location = /owner/product-feedback/review { return 404; }
    location = /owner/product-feedback/resolve { return 404; }

    location ~ ^/(?:owner|vault|database|backup|queue)(?:/|$) {
        return 404;
    }

    # Only these audited merchant/public endpoints may cross namespaces that
    # also contain operator diagnostics. The final `$` is part of the boundary:
    # adding a new backend endpoint never makes it public automatically.
    location ~ ^/(?:health|health/deep|readiness/product-saas|billing/plans|billing/usage|billing/media-credits|billing/checkout-contract|billing/domestic/contract|billing/domestic/orders|billing/manual-beta/orders|billing/webhook|billing/domestic/wechat-pay/notify|billing/domestic/wechat-pay/refund-notify|monitoring/cls/callback|media/capabilities)$ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_pass http://jiejing-saas:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/billing/domestic/orders/[^/]+(?:/(?:checkout|close|query|refund-request))?$ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_pass http://jiejing-saas:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/billing/manual-beta/orders/[^/]+/confirm$ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_pass http://jiejing-saas:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(?:infrastructure|readiness|domain|monitoring|billing|commercial|security)(?:/|$) {
        return 404;
    }

    # queue-jobs is the merchant workflow API; /queue/* remains internal and denied above.
    location ~ ^/(schema|independence|platforms|oauth|auth|analytics|me|companies|permissions|team|stores|model|post-publish|provider-job-contracts|controlled-bridges|secret-refs|connections|ebay-read-only|ebay-oauth|ebay-write|execution|data-packets|ip-risk-screening|merchant-memory|merchant-onboarding|ai-ceo|tasks|q[u]eue-jobs|media-asset-jobs|media-source-assets|reports|confirmations|execution-results|audit-logs|workers|webhooks)(/|$) {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_pass http://jiejing-saas:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy $jiejing_csp always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files $uri $uri/ /index.html;
    }
}
