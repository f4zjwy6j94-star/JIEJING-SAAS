name: Jiejing Cloud Fallback Self Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jiejing-cloud-fallback-self-check
  cancel-in-progress: false

jobs:
  self-check:
    name: Cloud fallback repository self-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JIEJING_SAAS_ENV: local_dev
      JIEJING_ENABLE_REAL_PLATFORM_WRITES: "0"
      JIEJING_QUEUE_PROVIDER: local_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements.saas-build.lock.txt
          python -m pip install --no-cache-dir --use-pep517 --no-build-isolation --require-hashes -r requirements.saas.lock.txt

      - name: Secret scan
        run: python tools/jiejing_secret_scan.py

      - name: Frontend syntax check
        run: node --check app.js

      - name: Cloud fallback guardrails
        run: python tools/test_jiejing_local_first_cloud_fallback_guardrails.py

      - name: GitHub deploy guardrails
        run: python tools/test_jiejing_github_actions_deploy_guardrails.py

      - name: Runner doctor guardrails
        run: python tools/test_jiejing_github_runner_doctor_guardrails.py

      - name: Runner maintenance guardrails
        run: python tools/test_jiejing_github_runner_maintenance_guardrails.py

      - name: Production paper ceremony contract
        run: python tools/test_jiejing_vault_sealed_paper_ceremony.py
