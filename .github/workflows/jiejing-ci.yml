name: Jiejing CI

# Official checkout/setup actions use Node 24; staging runner 2.336.0 was verified on 2026-08-02.

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  guardrails:
    name: Secret scan and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIEJING_SAAS_SESSION_SECRET: ci-session-secret-not-real-change-me-32
      JIEJING_SAAS_ENV: local_dev
      JIEJING_ENABLE_REAL_PLATFORM_WRITES: "0"
      JIEJING_QUEUE_PROVIDER: local_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements.saas-build.lock.txt
          python -m pip install --no-cache-dir --use-pep517 --no-build-isolation --require-hashes -r requirements.saas.lock.txt

      - name: Secret scan
        run: python tools/jiejing_secret_scan.py

      - name: Python compile
        run: >
          python -m py_compile
          jiejing_saas/ai_ceo_chat.py
          jiejing_saas/api_server.py
          jiejing_saas/readiness.py
          jiejing_saas/operational_health.py
          jiejing_saas/repository.py
          jiejing_saas/infrastructure_drivers.py
          jiejing_saas/ebay_account_deletion.py
          jiejing_saas/ebay_oauth_callback.py
          jiejing_saas/redis_queue_runtime.py
          jiejing_saas/vault_secret_resolver.py
          jiejing_saas/worker.py

      - name: Frontend syntax
        run: node --check app.js

      - name: Backend queue and health regressions
        run: |
          python tools/test_jiejing_operational_health_readiness.py
          python tools/test_jiejing_queue_recovery_heartbeat.py
          python tools/test_jiejing_postgres_durable_queue_adapter.py
          python tools/test_jiejing_managed_infra_readiness_cutover.py
          python tools/test_jiejing_infrastructure_drivers.py
          python tools/test_jiejing_stripe_checkout_portal.py
          python tools/test_jiejing_new_ebay_account_low_risk_runbook.py
          python tools/test_jiejing_ebay_account_deletion.py
          python tools/test_jiejing_ebay_oauth_callback_vault.py
          python tools/test_jiejing_vault_secret_resolver.py
          python tools/test_jiejing_tencent_cloud_integrations.py
          python tools/test_jiejing_sqlite_to_postgres_rehearsal.py

      - name: Deployment automation guardrails
        run: |
          python tools/test_jiejing_production_pilot_contract.py
          python tools/test_jiejing_vault_sealed_paper_ceremony.py
          python tools/test_jiejing_staging_deploy_channel_contract.py
          python tools/test_jiejing_production_deploy_channel.py
          python tools/test_jiejing_production_ops_consolidation.py
          python tools/test_jiejing_staging_patch_apply_contract.py
          python tools/test_jiejing_agents_md_guardrails.py
          python tools/test_jiejing_github_actions_deploy_guardrails.py
          python tools/test_jiejing_github_runner_doctor_guardrails.py
          python tools/test_jiejing_production_evidence_auto_refresh_guardrails.py

      - name: Frontend contract regressions
        run: |
          python tools/test_jiejing_frontend_staging_config.py
          python tools/test_jiejing_session_restore_and_ebay_ops_ui.py
          node --test tools/test_jiejing_auth_reveal_boundary.js
          python tools/test_jiejing_saas_clean_settings_and_listing_ui.py
          python tools/test_jiejing_settings_account_workspace_ui.py
          python tools/test_jiejing_frontend_settings_module_split.py
